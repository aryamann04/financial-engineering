services:
  trade-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FRED_API_KEY: ${FRED_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATA_DIR: /app/data
      DEFAULT_SYMBOL: ${DEFAULT_SYMBOL:-MES=F}
      DEFAULT_REFRESH_SECONDS: ${DEFAULT_REFRESH_SECONDS:-15}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
